<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/signup.css"></link>
  
 
    <title>Signup</title>
   
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="left-container">
        <h2>Create your account</h2>
        <button id="fb">
          <div  id="fbDiv">  <i class="bi bi-facebook"></i></div>
        
         Sign in with Facebook
        </button>
        <button id="twitter"
        >
        <div ID="TwDiv"><i class="bi bi-twitter"></i></div>Sign in with Twitter</button>
        <button  id="google"
        ><div id="googleDiv"><i class="bi bi-google"></i></div>Sign in with Google</button>
        <button id="behance">
          <div id="behanceDiv"><i class="bi bi-behance"></i></div>Sign in with Behance</button>
      </div>
      <div class="right-container">
        <h3>Modern Website Form</h3>

        <div class="inputDiv">
          <input type="text" placeholder="username" />
          <i class="bi bi-person"></i>
        </div>
         <div class="inputDiv">
          <input type="email" placeholder="email" />
          <i class="bi bi-envelope"></i>
        </div>
       <div class="inputDiv">
          <input type="password" placeholder="password" />
          <i class="bi bi-lock"></i>
        </div>
        <button id="submit">Sign Up</button>
      </div>
    </div>
  </body>
</html>
